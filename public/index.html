<title>Bin Workbench Builder</title>
<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<div id="root"></div>

<script>
var R = React;
var h = R.createElement;
var useState = R.useState, useMemo = R.useMemo, useCallback = R.useCallback, useEffect = R.useEffect, useRef = R.useRef;

// ── MEASURED CUBBY DIMENSIONS ───────────────────────────────
var CUBBY_DIMS = {
  "12gal": {
    long:  { opening: 15,     depth: 20.25, railH: 12.625, totalH: 14.5 },
    short: { opening: 20.25,  depth: 15,    railH: 12.625, totalH: 14.5 },
  },
  "27gal": {
    long:  { opening: 20.625, depth: 30.5,  railH: 12.75,  totalH: 15.5 },
    short: { opening: 30.5,   depth: 20.625,railH: 12.75,  totalH: 15.5 },
  },
};

var BIN_PRESETS = {
  "12gal": { name: "12 Gal (Greenmade/Costco)", overallW: 14.875, overallD: 20.375, overallH: 14.625, hangW: 13.875, hangD: 18.75, hangH: 12.5 },
  "27gal": { name: "27 Gal (Greenmade/Costco)", overallW: 20, overallD: 30, overallH: 15, hangW: 18, hangD: 28, hangH: 12.75 },
  custom:  { name: "Custom", overallW: 15, overallD: 20, overallH: 15, hangW: 14, hangD: 18.5, hangH: 12 },
};

var CLEARANCE = 0.25;
var FRAME_MATERIALS = {
  "2x4":     { name: '2×4 Lumber',     thickness: 1.5,  width: 3.5 },
  "plywood": { name: '3/4" Plywood Strips', thickness: 0.75, width: 3.5 },
  "furring": { name: 'Poplar 1×2 Furring', thickness: 0.75, width: 1.5 },
};
var SHELF_SUPPORT = { name: '1×2 Common Board', thickness: 0.75, width: 1.5 };
var PLYWOOD_THICKNESS = 0.75;
var WHEEL_HEIGHT = 3;
var TOP_OVERHANG = 1.5;

// ── CALCULATIONS ─────────────────────────────────────────────
function getRowCubby(rc, orient, customBin) {
  var cubbyOpening, singleDepth, cubbyRailH, cubbyTotalH;
  if (rc.binPreset !== "custom" && CUBBY_DIMS[rc.binPreset]) {
    var cd = CUBBY_DIMS[rc.binPreset][orient];
    cubbyOpening = cd.opening; singleDepth = cd.depth;
    cubbyRailH = cd.railH; cubbyTotalH = cd.totalH;
  } else {
    cubbyOpening = orient === "long" ? customBin.hangW + CLEARANCE * 2 : customBin.hangD + CLEARANCE * 2;
    singleDepth = orient === "long" ? customBin.overallD + CLEARANCE * 2 : customBin.overallW + CLEARANCE * 2;
    cubbyRailH = customBin.hangH + CLEARANCE;
    cubbyTotalH = customBin.overallH + CLEARANCE;
  }
  return { cubbyOpening: cubbyOpening, singleDepth: singleDepth, cubbyRailH: cubbyRailH, cubbyTotalH: cubbyTotalH };
}

function calculateDimensions(config) {
  var frame = FRAME_MATERIALS[config.frameMaterial];
  var orient = config.slideOut === "long" ? "long" : "short";

  var perRow = config.rowConfigs.map(function(rc) {
    var cd = getRowCubby(rc, orient, config.customBin);
    var binsDeep = rc.binsDeep || 1;
    var cubbyDepth = cd.singleDepth * binsDeep;
    var rowW = rc.cols * cd.cubbyOpening + (rc.cols + 1) * frame.thickness;
    return {
      cubbyOpening: cd.cubbyOpening, cubbyDepth: cubbyDepth, singleDepth: cd.singleDepth,
      cubbyRailH: cd.cubbyRailH, cubbyTotalH: cd.cubbyTotalH,
      cols: rc.cols, binsDeep: binsDeep, binPreset: rc.binPreset, rowW: rowW,
      yOffset: 0
    };
  });

  var rows = perRow.length;
  var y = 0;
  for (var i = 0; i < rows; i++) {
    y += SHELF_SUPPORT.width;
    perRow[i].yOffset = y;
    y += perRow[i].cubbyTotalH;
  }
  y += SHELF_SUPPORT.width;
  var cubbyAreaH = y;

  var maxRowW = 0, maxCubbyDepth = 0, maxCols = 0;
  for (var i = 0; i < rows; i++) {
    if (perRow[i].rowW > maxRowW) maxRowW = perRow[i].rowW;
    if (perRow[i].cubbyDepth > maxCubbyDepth) maxCubbyDepth = perRow[i].cubbyDepth;
    if (perRow[i].cols > maxCols) maxCols = perRow[i].cols;
  }

  var totalW = maxRowW;
  var totalD = maxCubbyDepth + frame.thickness * 2;
  var totalH = cubbyAreaH + (config.hasWheels ? WHEEL_HEIGHT : 0) + (config.hasTop ? PLYWOOD_THICKNESS : 0) + (config.hasBottomShelf ? PLYWOOD_THICKNESS : 0);
  var topW = config.hasTop ? totalW + TOP_OVERHANG * 2 : totalW;
  var topD = config.hasTop ? totalD + TOP_OVERHANG * 2 : totalD;
  var totalBins = 0;
  for (var i = 0; i < rows; i++) totalBins += perRow[i].cols * perRow[i].binsDeep;

  // Cut list
  var frameWidthRailCount = 4;
  var frameWidthRailLength = totalW;
  var frameDepthRailCount = 4;
  var frameDepthRailLength = totalD - frame.thickness * 2;
  var frameDividerCount = maxCols > 1 ? (maxCols - 1) * 2 : 0;
  var frameDividerLength = frameDepthRailLength;
  var uprightCount = (maxCols + 1) * 2;
  var uprightLength = cubbyAreaH;
  var totalShelfRails = 0;
  for (var lvl = 0; lvl <= rows; lvl++) {
    var lvlCols;
    if (lvl === 0) lvlCols = perRow[0].cols;
    else if (lvl === rows) lvlCols = perRow[rows - 1].cols;
    else lvlCols = Math.max(perRow[lvl - 1].cols, perRow[lvl].cols);
    totalShelfRails += lvlCols * 2;
  }
  var shelfRailLength = frameDepthRailLength;

  var plywoodSheets = Math.ceil(((config.hasTop ? topW * topD : 0) + (config.hasBottomShelf ? totalW * totalD : 0)) / (48 * 96));
  var allFrameIn = frameWidthRailCount * frameWidthRailLength + frameDepthRailCount * frameDepthRailLength + frameDividerCount * frameDividerLength + uprightCount * uprightLength;
  var frameTotal;
  if (config.frameMaterial === "plywood") {
    frameTotal = Math.ceil((allFrameIn * frame.width) / (48 * 96));
  } else {
    frameTotal = Math.ceil(allFrameIn / 96);
  }
  var eightFtOneBys = Math.ceil((totalShelfRails * shelfRailLength) / 96);

  return {
    totalW: totalW, totalH: totalH, totalD: totalD, topW: topW, topD: topD,
    cubbyAreaH: cubbyAreaH, totalBins: totalBins,
    plywoodSheets: plywoodSheets, frameTotal: frameTotal, eightFtOneBys: eightFtOneBys,
    frameMaterial: config.frameMaterial, frame: frame,
    frameWidthRailCount: frameWidthRailCount, frameWidthRailLength: frameWidthRailLength,
    frameDepthRailCount: frameDepthRailCount, frameDepthRailLength: frameDepthRailLength,
    frameDividerCount: frameDividerCount, frameDividerLength: frameDividerLength,
    uprightCount: uprightCount, uprightLength: uprightLength,
    totalShelfRails: totalShelfRails, shelfRailLength: shelfRailLength,
    perRow: perRow, rows: rows, maxCols: maxCols, maxCubbyDepth: maxCubbyDepth,
  };
}

// ── FRACTION FORMATTER ───────────────────────────────────────
function fmtFrac(n) {
  var whole = Math.floor(n);
  var frac = n - whole;
  if (frac < 0.0625) return "" + whole;
  if (frac < 0.1875) return whole + " 1/8";
  if (frac < 0.3125) return whole + " 1/4";
  if (frac < 0.4375) return whole + " 3/8";
  if (frac < 0.5625) return whole + " 1/2";
  if (frac < 0.6875) return whole + " 5/8";
  if (frac < 0.8125) return whole + " 3/4";
  if (frac < 0.9375) return whole + " 7/8";
  return "" + (whole + 1);
}

// ── SUPPLY LIST CALCULATOR ───────────────────────────────────
function calculateSupplyList(config, dims) {
  var frame = FRAME_MATERIALS[config.frameMaterial];
  var frameCornerScrews = 16;
  var dividerScrews = dims.frameDividerCount * 4;
  var uprightScrews = dims.uprightCount * 4;
  var framePocketTotal = frameCornerScrews + dividerScrews + uprightScrews;
  var frameScrewLen = frame.thickness >= 1.5 ? '2-1/2"' : '1-1/4"';
  var shelfRailScrews = dims.totalShelfRails * 4;
  var shelfScrewLen = '1-1/4"';
  var sameSize = frameScrewLen === shelfScrewLen;
  function boxQty(n) {
    if (n <= 50) return 50;
    if (n <= 100) return 100;
    if (n <= 250) return 250;
    return Math.ceil(n / 100) * 100;
  }
  var surfaceScrews = 0;
  if (config.hasTop) surfaceScrews += Math.ceil((dims.topW + dims.topD) * 2 / 8) * 2 + dims.maxCols * 4;
  if (config.hasBottomShelf) surfaceScrews += Math.ceil((dims.totalW + dims.totalD) * 2 / 8) * 2 + dims.maxCols * 4;

  // Build bin summary per preset
  var binCounts = {};
  dims.perRow.forEach(function(r) {
    var key = r.binPreset;
    if (!binCounts[key]) binCounts[key] = 0;
    binCounts[key] += r.cols * r.binsDeep;
  });

  return {
    frameLumber: dims.frameTotal,
    frameLumberLabel: config.frameMaterial === "plywood"
      ? '4×8 sheet' + (dims.frameTotal !== 1 ? 's' : '') + ' 3/4" plywood (rip into ' + frame.width + '" strips)'
      : '8ft ' + frame.name + (dims.frameTotal !== 1 ? 's' : ''),
    shelfRails: dims.eightFtOneBys,
    shelfRailLabel: '8ft 1×2 common board' + (dims.eightFtOneBys !== 1 ? 's' : ''),
    plywoodSheets: dims.plywoodSheets,
    needsPlywood: config.hasTop || config.hasBottomShelf,
    totes: dims.totalBins,
    binCounts: binCounts,
    casters: config.hasWheels ? 4 : 0,
    sameSize: sameSize,
    frameScrewLen: frameScrewLen,
    shelfScrewLen: shelfScrewLen,
    framePocketTotal: framePocketTotal,
    shelfRailScrews: shelfRailScrews,
    combinedPocket: sameSize ? framePocketTotal + shelfRailScrews : 0,
    combinedBox: sameSize ? boxQty(framePocketTotal + shelfRailScrews) : 0,
    frameBox: boxQty(framePocketTotal),
    shelfBox: boxQty(shelfRailScrews),
    surfaceScrews: surfaceScrews,
    surfaceBox: surfaceScrews > 0 ? boxQty(surfaceScrews) : 0,
  };
}

// ── 3D ROTATING PREVIEW ─────────────────────────────────────
function WorkbenchPreview(props) {
  var config = props.config, dims = props.dims;
  var angleState = useState(-0.55);
  var angle = angleState[0], setAngle = angleState[1];
  var spinState = useState(true);
  var spinning = spinState[0], setSpinning = spinState[1];
  var dragState = useState(null);
  var dragStart = dragState[0], setDragStart = dragState[1];
  var frameRef = useRef();
  var svgRef = useRef();

  // Auto-rotate
  useEffect(function() {
    if (!spinning) return;
    var last = 0;
    function tick(t) {
      if (last) setAngle(function(a) { return a - (t - last) * 0.0004; });
      last = t;
      frameRef.current = requestAnimationFrame(tick);
    }
    frameRef.current = requestAnimationFrame(tick);
    return function() { cancelAnimationFrame(frameRef.current); };
  }, [spinning]);

  // Drag to rotate
  var onPointerDown = useCallback(function(e) {
    setSpinning(false);
    setDragStart({ x: e.clientX, a: angle });
    e.currentTarget.setPointerCapture(e.pointerId);
  }, [angle]);
  var onPointerMove = useCallback(function(e) {
    if (!dragStart) return;
    var dx = e.clientX - dragStart.x;
    setAngle(dragStart.a + dx * 0.008);
  }, [dragStart]);
  var onPointerUp = useCallback(function() { setDragStart(null); }, []);
  var onDoubleClick = useCallback(function() { setSpinning(true); }, []);

  // Projection setup
  var cosA = Math.cos(angle), sinA = Math.sin(angle);
  var tilt = 0.38;
  var totalW = dims.totalW, totalH = dims.totalH, totalD = dims.totalD;
  var perRow = dims.perRow, rows = dims.rows;
  var ft = dims.frame.thickness;
  var hasWheels = config.hasWheels, hasTop = config.hasTop, hasBottomShelf = config.hasBottomShelf;

  // Compute scale to fit
  var corners = [
    [0,0,0],[totalW,0,0],[0,totalH,0],[totalW,totalH,0],
    [0,0,totalD],[totalW,0,totalD],[0,totalH,totalD],[totalW,totalH,totalD]
  ];
  if (hasTop) {
    var ov = TOP_OVERHANG;
    corners.push([-ov,totalH,-ov],[totalW+ov,totalH,-ov],[-ov,totalH,totalD+ov],[totalW+ov,totalH,totalD+ov]);
  }
  var minPX = 1e9, maxPX = -1e9, minPY = 1e9, maxPY = -1e9;
  corners.forEach(function(c) {
    var sx = c[0] * cosA - c[2] * sinA;
    var sy = -c[1] + (c[0] * sinA + c[2] * cosA) * tilt;
    if (sx < minPX) minPX = sx;
    if (sx > maxPX) maxPX = sx;
    if (sy < minPY) minPY = sy;
    if (sy > maxPY) maxPY = sy;
  });
  var rangeX = maxPX - minPX || 1, rangeY = maxPY - minPY || 1;
  var targetW = 500, targetH = 320;
  var sc = Math.min(targetW / rangeX, targetH / rangeY) * 0.82;
  var pad = 30;
  var ox = pad - minPX * sc;
  var oy = pad - minPY * sc;
  var svgW = rangeX * sc + pad * 2;
  var svgH = rangeY * sc + pad * 2;

  function px(x,y,z) { return ox + (x * cosA - z * sinA) * sc; }
  function py(x,y,z) { return oy + (-y + (x * sinA + z * cosA) * tilt) * sc; }
  function pt(x,y,z) { return px(x,y,z) + "," + py(x,y,z); }

  // Face visibility
  var showFront = cosA > 0;
  var showRight = sinA < 0;

  var matColors = {
    "2x4":     { face: "#c4a265", top: "#d4b87a", side: "#a8894f" },
    "plywood": { face: "#c9b896", top: "#d8cbb0", side: "#a89878" },
    "furring": { face: "#d4b07a", top: "#e0c490", side: "#b89060" },
  };
  var mc = matColors[dims.frameMaterial] || matColors["2x4"];

  // Collect all 3D boxes, sort by depth, then draw
  var boxes = [];
  var baseY = hasWheels ? WHEEL_HEIGHT : 0;
  var shelfBase = baseY + (hasBottomShelf ? PLYWOOD_THICKNESS : 0);

  function addBox(bx,by,bz,bw,bh,bd,fCol,tCol,sCol,type) {
    var cx = bx + bw / 2, cy = by + bh / 2, cz = bz + bd / 2;
    var depth = cx * sinA + cz * cosA;
    boxes.push({ x:bx,y:by,z:bz,w:bw,h:bh,d:bd,fc:fCol,tc:tCol,sc:sCol,depth:depth,type:type||"" });
  }

  // Wheels
  if (hasWheels) {
    addBox(ft, 0, ft, ft, WHEEL_HEIGHT, ft, "#555", "#666", "#444", "wheel");
    addBox(totalW-ft*2, 0, ft, ft, WHEEL_HEIGHT, ft, "#555", "#666", "#444", "wheel");
    addBox(ft, 0, totalD-ft*2, ft, WHEEL_HEIGHT, ft, "#555", "#666", "#444", "wheel");
    addBox(totalW-ft*2, 0, totalD-ft*2, ft, WHEEL_HEIGHT, ft, "#555", "#666", "#444", "wheel");
  }

  // Bottom shelf
  if (hasBottomShelf) {
    addBox(0, baseY, 0, totalW, PLYWOOD_THICKNESS, totalD, mc.side, mc.top, mc.face, "shelf");
  }

  // Uprights - use maxCols for the outer frame
  for (var c = 0; c <= dims.maxCols; c++) {
    // Use the widest row's spacing for uprights
    var widestRow = perRow[0]; for (var rr = 1; rr < rows; rr++) { if (perRow[rr].rowW > widestRow.rowW) widestRow = perRow[rr]; }
    var ux = c * (widestRow.cubbyOpening + ft);
    if (ux + ft > totalW) ux = totalW - ft;
    // Front upright
    addBox(ux, shelfBase, 0, ft, dims.cubbyAreaH, ft, mc.face, mc.top, mc.side, "upright");
    // Back upright
    addBox(ux, shelfBase, totalD - ft, ft, dims.cubbyAreaH, ft, mc.face, mc.top, mc.side, "upright");
  }

  // Per-row: shelf rails and bins
  for (var ri = 0; ri < rows; ri++) {
    var row = perRow[ri];
    var rowYBase = shelfBase + row.yOffset;
    var rowXOffset = (totalW - row.rowW) / 2; // center narrower rows

    // Shelf rails at bottom of this row
    var railY = rowYBase - SHELF_SUPPORT.width;
    addBox(rowXOffset, railY, 0, row.rowW, SHELF_SUPPORT.width, ft * 0.5, "#b8a070", "#c8b488", "#9a8560", "rail");

    // Shelf rails at top of this row (only for last row)
    if (ri === rows - 1) {
      var topRailY = rowYBase + row.cubbyTotalH;
      addBox(rowXOffset, topRailY, 0, row.rowW, SHELF_SUPPORT.width, ft * 0.5, "#b8a070", "#c8b488", "#9a8560", "rail");
    }

    // Cross-member depth rails (subtle)
    for (var cc = 0; cc <= row.cols; cc++) {
      var cmx = rowXOffset + cc * (row.cubbyOpening + ft);
      addBox(cmx + ft * 0.25, railY + SHELF_SUPPORT.width * 0.25, ft, ft * 0.5, SHELF_SUPPORT.width * 0.5, totalD - ft * 2, mc.side, null, null, "crossmember");
    }

    // Bins
    for (var cc = 0; cc < row.cols; cc++) {
      var binX = rowXOffset + cc * (row.cubbyOpening + ft) + ft;
      for (var dd = 0; dd < row.binsDeep; dd++) {
        var binZ = ft + dd * row.singleDepth;
        var binD = row.singleDepth - (dd === row.binsDeep - 1 ? ft : 0.5);
        var bodyH = row.cubbyTotalH * 0.82;
        var lidH = row.cubbyTotalH - bodyH;
        addBox(binX, rowYBase, binZ, row.cubbyOpening, bodyH, binD, "#2a2d2e", "#333", "#222", "bin");
        addBox(binX, rowYBase + bodyH, binZ, row.cubbyOpening, lidH, binD, "#e8b710", "#f0c420", "#c99e0e", "lid");
      }
    }
  }

  // Top surface
  if (hasTop) {
    var topY = shelfBase + dims.cubbyAreaH;
    var ov = TOP_OVERHANG;
    addBox(-ov, topY, -ov, totalW + ov * 2, PLYWOOD_THICKNESS, totalD + ov * 2, mc.face, mc.top, mc.side, "top");
  }

  // Sort by depth (farthest first)
  boxes.sort(function(a, b) { return b.depth - a.depth; });

  // Draw
  var els = [];
  var key = 0;
  var str = "#00000025";
  boxes.forEach(function(b) {
    // For each box, draw visible faces in back-to-front order
    var f, t, s, pts;

    // Back face (if front is hidden, back is visible)
    if (!showFront) {
      pts = [pt(b.x,b.y,b.z+b.d),pt(b.x+b.w,b.y,b.z+b.d),pt(b.x+b.w,b.y+b.h,b.z+b.d),pt(b.x,b.y+b.h,b.z+b.d)].join(" ");
      els.push(h("polygon",{key:key++,points:pts,fill:b.fc,stroke:str,strokeWidth:0.5}));
    }

    // Left side (visible when sinA > 0)
    if (sinA > 0 && b.sc) {
      pts = [pt(b.x,b.y,b.z),pt(b.x,b.y,b.z+b.d),pt(b.x,b.y+b.h,b.z+b.d),pt(b.x,b.y+b.h,b.z)].join(" ");
      els.push(h("polygon",{key:key++,points:pts,fill:b.sc,stroke:str,strokeWidth:0.5}));
    }

    // Right side (visible when sinA < 0)
    if (showRight && b.sc) {
      pts = [pt(b.x+b.w,b.y,b.z),pt(b.x+b.w,b.y,b.z+b.d),pt(b.x+b.w,b.y+b.h,b.z+b.d),pt(b.x+b.w,b.y+b.h,b.z)].join(" ");
      els.push(h("polygon",{key:key++,points:pts,fill:b.sc,stroke:str,strokeWidth:0.5}));
    }

    // Front face
    if (showFront) {
      pts = [pt(b.x,b.y,b.z),pt(b.x+b.w,b.y,b.z),pt(b.x+b.w,b.y+b.h,b.z),pt(b.x,b.y+b.h,b.z)].join(" ");
      els.push(h("polygon",{key:key++,points:pts,fill:b.fc,stroke:str,strokeWidth:0.5}));
    }

    // Top face
    if (b.tc) {

// ── BLUEPRINT ───────────────────────────────────────────────
function Blueprint(props) {
  var config = props.config, dims = props.dims;
  var perRow = dims.perRow, rows = dims.rows;
  var ft = dims.frame.thickness;
  var totalW = dims.totalW, totalD = dims.totalD;
  var topW = config.hasTop ? dims.topW : totalW;
  var topD = config.hasTop ? dims.topD : totalD;
  var wheelH = config.hasWheels ? WHEEL_HEIGHT : 0;
  var topH = config.hasTop ? PLYWOOD_THICKNESS : 0;
  var bottomH = config.hasBottomShelf ? PLYWOOD_THICKNESS : 0;
  var overallH = dims.totalH;

  // ── FRONT ELEVATION ──
  var margin = 55, drawW = 440;
  var scaleF = Math.min(drawW / totalW, 220 / overallH);
  var fW = totalW * scaleF, fH = overallH * scaleF;
  var fOx = margin + (drawW - fW) / 2;
  var fOy = margin / 2 + 10;
  var fe = [], k = 0;
  var baseY = fOy + fH - wheelH * scaleF;
  var shelfBase = baseY;

  // Wheels
  if (config.hasWheels) {
    var wh = wheelH * scaleF;
    [ft * 2, totalW - ft * 2].forEach(function(wx) {
      fe.push(h("circle",{key:k++,cx:fOx+wx*scaleF,cy:fOy+fH-wh/2,r:wh*0.35,fill:"#ccc",stroke:"#333",strokeWidth:0.75}));
    });
  }

  // Bottom shelf
  if (config.hasBottomShelf) {
    fe.push(h("rect",{key:k++,x:fOx,y:baseY-bottomH*scaleF,width:fW,height:bottomH*scaleF,fill:"#ddd",stroke:"#333",strokeWidth:0.75}));
    shelfBase = baseY - bottomH * scaleF;
  }

  // Cubby frame area
  var cubbyH = dims.cubbyAreaH * scaleF;
  var cubbyTop = shelfBase - cubbyH;
  fe.push(h("rect",{key:k++,x:fOx,y:cubbyTop,width:fW,height:cubbyH,fill:"none",stroke:"#333",strokeWidth:1.5}));

  // Per-row: uprights, shelf rails, bins
  for (var ri = 0; ri < rows; ri++) {
    var row = perRow[ri];
    var rowXOffset = (totalW - row.rowW) / 2;
    var rowYTop = cubbyTop + (dims.cubbyAreaH - row.yOffset - row.cubbyTotalH) * scaleF;

    // Shelf rail below this row
    var railYBot = cubbyTop + (dims.cubbyAreaH - row.yOffset) * scaleF;
    fe.push(h("rect",{key:k++,x:fOx+rowXOffset*scaleF,y:railYBot,width:row.rowW*scaleF,height:SHELF_SUPPORT.width*scaleF,fill:"#eee",stroke:"#555",strokeWidth:0.5}));

    // Uprights for this row
    for (var cc = 0; cc <= row.cols; cc++) {
      var ux = rowXOffset + cc * (row.cubbyOpening + ft);
      fe.push(h("rect",{key:k++,x:fOx+ux*scaleF,y:rowYTop,width:ft*scaleF,height:(row.cubbyTotalH+SHELF_SUPPORT.width)*scaleF,fill:"#ddd",stroke:"#555",strokeWidth:0.5}));
    }

    // Bins
    for (var cc = 0; cc < row.cols; cc++) {
      var bx = fOx + (rowXOffset + cc * (row.cubbyOpening + ft) + ft) * scaleF + 2;
      var by = rowYTop + 2;
      var bw = row.cubbyOpening * scaleF - 4;
      var bh = row.cubbyTotalH * scaleF - 4;
      fe.push(h("rect",{key:k++,x:bx,y:by,width:bw,height:bh,fill:"none",stroke:"#aaa",strokeWidth:0.5,strokeDasharray:"3,2",rx:2}));
      if (row.binsDeep > 1) {
        fe.push(h("text",{key:k++,x:bx+bw/2,y:by+bh/2+4,textAnchor:"middle",fontSize:9,fill:"#999",fontFamily:"monospace"},row.binsDeep+" deep"));
      }
    }

    // Top shelf rail (only for last row)
    if (ri === rows - 1) {
      fe.push(h("rect",{key:k++,x:fOx,y:cubbyTop,width:fW,height:SHELF_SUPPORT.width*scaleF,fill:"#eee",stroke:"#555",strokeWidth:0.5}));
    }
  }

  // Top surface
  if (config.hasTop) {
    var tsx = fOx - TOP_OVERHANG * scaleF;
    var tsy = cubbyTop - topH * scaleF;
    fe.push(h("rect",{key:k++,x:tsx,y:tsy,width:topW*scaleF,height:topH*scaleF,fill:"#ccc",stroke:"#333",strokeWidth:1}));
  }

  // Dimensions
  var dwy = fOy + fH + 16;
  fe.push(h("line",{key:k++,x1:fOx,y1:fOy+fH+2,x2:fOx,y2:dwy+4,stroke:"#888",strokeWidth:0.5}));
  fe.push(h("line",{key:k++,x1:fOx+fW,y1:fOy+fH+2,x2:fOx+fW,y2:dwy+4,stroke:"#888",strokeWidth:0.5}));
  fe.push(h("line",{key:k++,x1:fOx,y1:dwy,x2:fOx+fW,y2:dwy,stroke:"#555",strokeWidth:0.75}));
  fe.push(h("text",{key:k++,x:fOx+fW/2,y:dwy+12,textAnchor:"middle",fontSize:10,fill:"#333",fontFamily:"monospace"},fmtFrac(totalW)+'"'));

  var dhx = fOx - 14;
  var htop = config.hasTop ? cubbyTop - topH * scaleF : cubbyTop;
  fe.push(h("line",{key:k++,x1:fOx-2,y1:htop,x2:dhx-4,y2:htop,stroke:"#888",strokeWidth:0.5}));
  fe.push(h("line",{key:k++,x1:fOx-2,y1:fOy+fH,x2:dhx-4,y2:fOy+fH,stroke:"#888",strokeWidth:0.5}));
  fe.push(h("line",{key:k++,x1:dhx,y1:htop,x2:dhx,y2:fOy+fH,stroke:"#555",strokeWidth:0.75}));
  var hmy = (htop + fOy + fH) / 2;
  fe.push(h("text",{key:k++,x:dhx-3,y:hmy,textAnchor:"middle",fontSize:10,fill:"#333",fontFamily:"monospace",transform:"rotate(-90,"+(dhx-3)+","+hmy+")"},fmtFrac(overallH)+'"'));

  var fSvgW = drawW + margin * 2 + 30;
  var fSvgH = fH + margin + 36;

  // ── TOP VIEW ──
  var scaleT = Math.min(drawW / topW, 130 / topD);
  var tW = topW * scaleT, tH = topD * scaleT;
  var tOx = margin + (drawW - tW) / 2;
  var tOy = 16;
  var te = []; k = 0;
  te.push(h("rect",{key:k++,x:tOx,y:tOy,width:tW,height:tH,fill:"#eee",stroke:"#333",strokeWidth:1.5}));
  if (config.hasTop) {
    te.push(h("rect",{key:k++,x:tOx+TOP_OVERHANG*scaleT,y:tOy+TOP_OVERHANG*scaleT,width:totalW*scaleT,height:totalD*scaleT,fill:"none",stroke:"#999",strokeWidth:0.75,strokeDasharray:"4,2"}));
  }
  // Column dividers for each row (shown in top view)
  for (var ri = 0; ri < rows; ri++) {
    var row = perRow[ri];
    var rowXOff = (totalW - row.rowW) / 2;
    var fsx = tOx + (config.hasTop ? TOP_OVERHANG * scaleT : 0) + rowXOff * scaleT;
    for (var ci = 0; ci <= row.cols; ci++) {
      var lx = fsx + ci * (row.cubbyOpening + ft) * scaleT;
      var ly1 = tOy + (config.hasTop ? TOP_OVERHANG * scaleT : 0);
      var ly2 = ly1 + totalD * scaleT;
      te.push(h("line",{key:k++,x1:lx,y1:ly1,x2:lx,y2:ly2,stroke:"#aaa",strokeWidth:ft*scaleT>1?ft*scaleT:0.75,opacity:0.6}));
    }
  }
  // Width dimension
  var twdy = tOy + tH + 14;
  te.push(h("line",{key:k++,x1:tOx,y1:tOy+tH+2,x2:tOx,y2:twdy+4,stroke:"#888",strokeWidth:0.5}));
  te.push(h("line",{key:k++,x1:tOx+tW,y1:tOy+tH+2,x2:tOx+tW,y2:twdy+4,stroke:"#888",strokeWidth:0.5}));
  te.push(h("line",{key:k++,x1:tOx,y1:twdy,x2:tOx+tW,y2:twdy,stroke:"#555",strokeWidth:0.75}));
  te.push(h("text",{key:k++,x:tOx+tW/2,y:twdy+12,textAnchor:"middle",fontSize:10,fill:"#333",fontFamily:"monospace"},fmtFrac(topW)+'"'));
  // Depth dimension
  var tddx = tOx - 14;
  te.push(h("line",{key:k++,x1:tOx-2,y1:tOy,x2:tddx-4,y2:tOy,stroke:"#888",strokeWidth:0.5}));
  te.push(h("line",{key:k++,x1:tOx-2,y1:tOy+tH,x2:tddx-4,y2:tOy+tH,stroke:"#888",strokeWidth:0.5}));
  te.push(h("line",{key:k++,x1:tddx,y1:tOy,x2:tddx,y2:tOy+tH,stroke:"#555",strokeWidth:0.75}));
  var tdmy = tOy + tH / 2;
  te.push(h("text",{key:k++,x:tddx-3,y:tdmy,textAnchor:"middle",fontSize:10,fill:"#333",fontFamily:"monospace",transform:"rotate(-90,"+(tddx-3)+","+tdmy+")"},fmtFrac(topD)+'"'));
  var tSvgH = tH + 48;

  function handlePrint() {
    var el = document.getElementById("blueprint-print-area");
    var win = window.open("","_blank","width=800,height=600");
    win.document.write('<!DOCTYPE html><html><head><title>Workbench Blueprint</title>');
    win.document.write('<style>body{font-family:"Courier New",monospace;padding:24px;color:#222}h2{margin:0 0 4px}p{margin:0 0 16px;color:#555;font-size:13px}svg{display:block;margin:8px auto;border:1px solid #ccc;background:#fff;max-width:100%}.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#555;margin:16px 0 4px}</style>');
    win.document.write('</head><body>');
    win.document.write('<h2>Bin Workbench Blueprint</h2>');
    win.document.write('<p>' + dims.totalBins + ' bins — ' + rows + ' row' + (rows>1?'s':'') + ' — ' + FRAME_MATERIALS[config.frameMaterial].name + ' frame</p>');
    var svgs = el.querySelectorAll("svg");
    var labels = el.querySelectorAll(".bp-label");
    for (var i = 0; i < svgs.length; i++) {
      if (labels[i]) win.document.write('<div class="label">' + labels[i].textContent + '</div>');
      win.document.write(svgs[i].outerHTML);
    }
    win.document.write('</body></html>');
    win.document.close();
    setTimeout(function(){ win.print(); }, 300);
  }

  return h("div",null,
    h("div",{style:{display:"flex",gap:8,marginBottom:12}},
      h("button",{onClick:handlePrint,style:{padding:"8px 16px",background:"var(--btn-bg)",color:"var(--gold)",border:"1px solid var(--border)",borderRadius:6,fontSize:12,fontWeight:600,cursor:"pointer"}},"🖨 Print Blueprint")
    ),
    h("div",{id:"blueprint-print-area"},
      h("div",{className:"bp-label",style:{fontSize:11,fontWeight:700,color:"var(--gold)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.05em"}},"Front Elevation"),
      h("svg",{viewBox:"0 0 "+fSvgW+" "+fSvgH,style:{width:"100%",maxWidth:600,height:"auto",background:"#fff",borderRadius:8,border:"1px solid var(--border)"}},fe),
      h("div",{className:"bp-label",style:{fontSize:11,fontWeight:700,color:"var(--gold)",marginTop:12,marginBottom:6,textTransform:"uppercase",letterSpacing:"0.05em"}},"Top View (Plan)"),
      h("svg",{viewBox:"0 0 "+fSvgW+" "+tSvgH,style:{width:"100%",maxWidth:600,height:"auto",background:"#fff",borderRadius:8,border:"1px solid var(--border)"}},te)
    )
  );
}

// ── MAIN APP ─────────────────────────────────────────────────
function App() {
  var configState = useState({
    rowConfigs: [
      { binPreset: "12gal", cols: 4, binsDeep: 1 },
      { binPreset: "12gal", cols: 4, binsDeep: 1 },
    ],
    slideOut: "long",
    frameMaterial: "2x4",
    hasTop: true, hasBottomShelf: true, hasWheels: true,
    customBin: { overallW:15, overallD:20, overallH:15, hangW:14, hangD:18.5, hangH:12 },
  });
  var config = configState[0], setConfig = configState[1];

  var update = useCallback(function(key,val) {
    setConfig(function(p) { var n = {}; for (var k in p) n[k] = p[k]; n[key] = val; return n; });
  },[]);

  var updateRow = useCallback(function(index, changes) {
    setConfig(function(p) {
      var newRows = p.rowConfigs.map(function(r, i) {
        if (i !== index) return r;
        var n = {}; for (var k in r) n[k] = r[k]; for (var k in changes) n[k] = changes[k]; return n;
      });
      var n = {}; for (var k in p) n[k] = p[k]; n.rowConfigs = newRows; return n;
    });
  },[]);

  var setRowCount = useCallback(function(count) {
    setConfig(function(p) {
      var cur = p.rowConfigs;
      var newRows;
      if (count > cur.length) {
        newRows = cur.slice();
        var last = cur[cur.length - 1];
        for (var i = cur.length; i < count; i++) {
          newRows.push({ binPreset: last.binPreset, cols: last.cols, binsDeep: last.binsDeep });
        }
      } else {
        newRows = cur.slice(0, count);
      }
      var n = {}; for (var k in p) n[k] = p[k]; n.rowConfigs = newRows; return n;
    });
  },[]);

  var updateCustomBin = useCallback(function(key,val) {
    setConfig(function(p) {
      var cb = {}; for (var k in p.customBin) cb[k] = p.customBin[k]; cb[key] = val;
      var n = {}; for (var k in p) n[k] = p[k]; n.customBin = cb; return n;
    });
  },[]);

  var dims = useMemo(function(){ return calculateDimensions(config); },[config]);
  var supplyList = useMemo(function(){ return calculateSupplyList(config, dims); },[config, dims]);

  var rows = config.rowConfigs.length;
  var frameName = function(short) {
    if (config.frameMaterial==="2x4") return short ? "2×4" : "2×4 Lumber";
    if (config.frameMaterial==="plywood") return short ? '3/4" ply' : '3/4" Plywood Strips';
    return short ? "1×2 furring" : "Poplar 1×2 Furring";
  };
  var sagWarning = config.frameMaterial === "furring" && dims.perRow.some(function(r){ return r.cubbyOpening > 18; });

  // Build a bin summary string
  var binSummary = [];
  var binCounts = supplyList.binCounts;
  for (var bp in binCounts) {
    if (binCounts[bp] > 0) {
      var name = BIN_PRESETS[bp] ? BIN_PRESETS[bp].name : "Custom";
      binSummary.push(binCounts[bp] + " × " + name);
    }
  }

  return h("div",{style:{minHeight:"100vh",background:"var(--bg)",color:"var(--text)",fontFamily:"'Segoe UI', -apple-system, sans-serif",padding:"20px 16px"}},
    h("div",{style:{maxWidth:1140,margin:"0 auto"}},
      // Header
      h("div",{style:{marginBottom:24}},
        h("div",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:4}},
          h("div",{style:{width:36,height:36,borderRadius:8,background:"linear-gradient(135deg, var(--gold), #c99e0e)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:800}},"⚙"),
          h("h1",{style:{fontSize:24,fontWeight:800,margin:0,color:"var(--gold)"}},"Bin Workbench Builder")
        ),
        h("p",{style:{margin:0,fontSize:13,color:"var(--dim)"}},"Greenmade / Costco tote storage workbench configurator")
      ),

      h("div",{className:"main-grid",style:{display:"grid",gridTemplateColumns:"340px 1fr",gap:20,alignItems:"start"}},

        // ── LEFT PANEL ──
        h("div",{style:{display:"flex",flexDirection:"column",gap:14,minWidth:0}},

          // Row configuration
          h(Section,{title:"Rows"},
            h("div",{style:{marginBottom:12}},
              h(Stepper,{label:"Number of Rows",value:rows,onChange:setRowCount,min:1,max:6})
            ),
            h("div",{style:{display:"flex",flexDirection:"column",gap:8}},
              config.rowConfigs.map(function(rc, i) {
                return h(RowConfigCard,{key:i,index:i,rowConfig:rc,total:rows,onChange:function(changes){updateRow(i,changes)}});
              })
            )
          ),

          h(Section,{title:"Slide-Out Orientation"},
            h(OptionButtons,{options:[["long","Long Side on Rails"],["short","Short Side on Rails"]],value:config.slideOut,onChange:function(v){update("slideOut",v)}}),
            h("div",{style:{marginTop:8,fontSize:11,color:"var(--dim)",lineHeight:1.5}},
              config.slideOut==="long"
                ? "Long side sits on rails going into depth. Short side faces you."
                : "Short side sits on rails going into depth. Long side faces you."
            )
          ),

          h(Section,{title:"Frame Material"},
            h(OptionButtons,{options:[["2x4","2×4 Lumber"],["plywood",'3/4" Plywood'],["furring","1×2 Furring"]],value:config.frameMaterial,onChange:function(v){update("frameMaterial",v)}}),
            h("div",{style:{marginTop:8,fontSize:11,color:"var(--dim)"}},
              config.frameMaterial==="furring"
                ? 'Poplar 1×2 furring strips (0.75" × 1.5"). Orient 1.5" side vertical for best sag resistance.'
                : "Shelf supports: 1×2 common boards (" + SHELF_SUPPORT.thickness + '" × ' + SHELF_SUPPORT.width + '")'
            ),
            sagWarning ? h("div",{style:{marginTop:8,padding:8,background:"var(--warn-bg)",borderRadius:6,border:"1px solid var(--warn-border)",fontSize:11,color:"var(--warn)",lineHeight:1.5}},
              "⚠ Some openings exceed 18\". Furring strips may sag. Consider 1×2 common boards for shelf rails."
            ) : null
          ),

          h(Section,{title:"Features"},
            h("div",{style:{display:"flex",flexDirection:"column",gap:14}},
              h(Toggle,{label:'Flat Top (3/4" plywood work surface)',checked:config.hasTop,onChange:function(v){update("hasTop",v)}}),
              h(Toggle,{label:'Bottom Shelf (3/4" plywood)',checked:config.hasBottomShelf,onChange:function(v){update("hasBottomShelf",v)}}),
              h(Toggle,{label:"Caster Wheels",checked:config.hasWheels,onChange:function(v){update("hasWheels",v)}})
            )
          )
        ),

        // ── RIGHT PANEL ──
        h("div",{style:{display:"flex",flexDirection:"column",gap:16,minWidth:0}},

          h(Section,{title:"Preview"},
            h(WorkbenchPreview,{config:config,dims:dims})
          ),

          h(Section,{title:"Overall Dimensions"},
            h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4, 1fr)",gap:10}},
              [["Width",fmtFrac(config.hasTop?dims.topW:dims.totalW)+'"'],["Depth",fmtFrac(config.hasTop?dims.topD:dims.totalD)+'"'],["Height",fmtFrac(dims.totalH)+'"'],["Total Bins",dims.totalBins]].map(function(item){
                return h("div",{key:item[0],style:{background:"var(--input-bg)",borderRadius:8,padding:"12px 8px",textAlign:"center"}},
                  h("div",{style:{fontSize:18,fontWeight:700,color:"var(--gold)",fontFamily:"monospace"}},item[1]),
                  h("div",{style:{fontSize:10,color:"var(--dim)",marginTop:3,fontWeight:600,textTransform:"uppercase"}},item[0])
                );
              })
            ),
            // Per-row cubby dims summary
            h("div",{style:{marginTop:10,display:"flex",flexDirection:"column",gap:6}},
              dims.perRow.map(function(row, i) {
                return h("div",{key:i,style:{background:"var(--input-bg)",borderRadius:8,padding:"8px 12px",fontSize:12}},
                  h("span",{style:{color:"var(--gold)",fontWeight:700}},"Row " + (i+1) + ": "),
                  h("span",{style:{color:"var(--bright)"}},
                    (row.binPreset === "12gal" ? "12 Gal" : row.binPreset === "27gal" ? "27 Gal" : "Custom") +
                    " — " + row.cols + " col" + (row.cols>1?"s":"") +
                    " × " + row.binsDeep + " deep" +
                    " — Opening: " + fmtFrac(row.cubbyOpening) + '" — Depth: ' + fmtFrac(row.cubbyDepth) + '"'
                  )
                );
              })
            )
          ),

          // Cut List
          h(Section,{title:"Cut List (Build Order)"},
            h("div",{style:{fontSize:11,fontWeight:700,color:"var(--gold)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.05em"}},"Step 1: Top & Bottom Frames"),
            h("div",{style:{display:"flex",flexDirection:"column",gap:5,marginBottom:16}},
              h(CutItem,{name:"Width Rails ("+frameName(true)+")",qty:dims.frameWidthRailCount,detail:fmtFrac(dims.frameWidthRailLength)+"\" each",note:"Front & back rails, both frames"}),
              h(CutItem,{name:"Depth Rails ("+frameName(true)+")",qty:dims.frameDepthRailCount,detail:fmtFrac(dims.frameDepthRailLength)+"\" each",note:"Side rails, both frames"}),
              dims.frameDividerCount > 0 ? h(CutItem,{name:"Frame Dividers ("+frameName(true)+")",qty:dims.frameDividerCount,detail:fmtFrac(dims.frameDividerLength)+"\" each",note:"Column dividers inside frames"}) : null
            ),

            h("div",{style:{fontSize:11,fontWeight:700,color:"var(--gold)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.05em"}},"Step 2: Uprights"),
            h("div",{style:{display:"flex",flexDirection:"column",gap:5,marginBottom:16}},
              h(CutItem,{name:"Vertical Uprights ("+frameName(true)+")",qty:dims.uprightCount,detail:fmtFrac(dims.uprightLength)+"\" each",note:"Connect top & bottom frames"})
            ),

            h("div",{style:{fontSize:11,fontWeight:700,color:"var(--gold)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.05em"}},"Step 3: Shelf Rails"),
            h("div",{style:{display:"flex",flexDirection:"column",gap:5,marginBottom:16}},
              h(CutItem,{name:"Shelf Supports (1×2)",qty:dims.totalShelfRails,detail:fmtFrac(dims.shelfRailLength)+"\" each",note:"Bin rest rails inside cubbies"})
            ),

            (config.hasTop || config.hasBottomShelf) ? h("div",null,
              h("div",{style:{fontSize:11,fontWeight:700,color:"var(--gold)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.05em"}},"Step 4: Surfaces"),
              h("div",{style:{display:"flex",flexDirection:"column",gap:5,marginBottom:16}},
                config.hasTop ? h(CutItem,{name:'Top Surface (3/4" plywood)',qty:1,detail:fmtFrac(dims.topW)+"\" × "+fmtFrac(dims.topD)+"\"",note:"Work surface with overhang"}) : null,
                config.hasBottomShelf ? h(CutItem,{name:'Bottom Shelf (3/4" plywood)',qty:1,detail:fmtFrac(dims.totalW)+"\" × "+fmtFrac(dims.totalD)+"\"",note:"Base platform"}) : null
              )
            ) : null,

            // Shopping summary
            h("div",{style:{padding:12,background:"var(--input-bg)",borderRadius:8,display:"grid",gridTemplateColumns:"repeat(4, 1fr)",gap:8,textAlign:"center"}},
              h("div",null,
                h("div",{style:{fontSize:18,fontWeight:700,color:"var(--green)",fontFamily:"monospace"}},"~"+dims.frameTotal),
                h("div",{style:{fontSize:10,color:"var(--dim)",textTransform:"uppercase"}},config.frameMaterial==="plywood"?"4×8 Ply":"8ft "+frameName(true)+"s")
              ),
              h("div",null,
                h("div",{style:{fontSize:18,fontWeight:700,color:"var(--green)",fontFamily:"monospace"}},"~"+dims.plywoodSheets),
                h("div",{style:{fontSize:10,color:"var(--dim)",textTransform:"uppercase"}},"4×8 Ply (surf)")
              ),
              h("div",null,
                h("div",{style:{fontSize:18,fontWeight:700,color:"var(--green)",fontFamily:"monospace"}},"~"+dims.eightFtOneBys),
                h("div",{style:{fontSize:10,color:"var(--dim)",textTransform:"uppercase"}},"8ft 1×2s")
              ),
              h("div",null,
                h("div",{style:{fontSize:18,fontWeight:700,color:"var(--green)",fontFamily:"monospace"}},dims.totalBins),
                h("div",{style:{fontSize:10,color:"var(--dim)",textTransform:"uppercase"}},"Totes")
              )
            )
          ),

          // Shopping List
          h(Section,{title:"Shopping List"},
            h("div",{style:{fontSize:11,fontWeight:700,color:"var(--gold)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.05em"}},"Lumber"),
            h("div",{style:{display:"flex",flexDirection:"column",gap:5,marginBottom:14}},
              h(SupplyItem,{check:true,name:"Frame lumber",qty:supplyList.frameLumber,detail:supplyList.frameLumberLabel}),
              h(SupplyItem,{check:true,name:"Shelf rail boards",qty:supplyList.shelfRails,detail:supplyList.shelfRailLabel}),
              supplyList.needsPlywood ? h(SupplyItem,{check:true,name:'Surface plywood (3/4")',qty:supplyList.plywoodSheets,detail:"4×8 sheet"+(supplyList.plywoodSheets!==1?"s":"")}) : null
            ),

            h("div",{style:{fontSize:11,fontWeight:700,color:"var(--gold)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.05em"}},"Hardware"),
            h("div",{style:{display:"flex",flexDirection:"column",gap:5,marginBottom:14}},
              supplyList.sameSize
                ? h(SupplyItem,{check:true,name:supplyList.frameScrewLen+" pocket hole screws",qty:"box of "+supplyList.combinedBox,detail:supplyList.combinedPocket+" needed"})
                : h("div",null,
                    h(SupplyItem,{check:true,name:supplyList.frameScrewLen+" pocket screws (frames)",qty:"box of "+supplyList.frameBox,detail:supplyList.framePocketTotal+" needed"}),
                    h("div",{style:{height:5}}),
                    h(SupplyItem,{check:true,name:supplyList.shelfScrewLen+" pocket screws (shelves)",qty:"box of "+supplyList.shelfBox,detail:supplyList.shelfRailScrews+" needed"})
                  ),
              supplyList.surfaceScrews > 0 ? h(SupplyItem,{check:true,name:'1-1/4" wood screws (plywood)',qty:"box of "+supplyList.surfaceBox,detail:supplyList.surfaceScrews+" needed"}) : null,
              h(SupplyItem,{check:true,name:"Wood glue",qty:"1",detail:"Titebond II or III"}),
              supplyList.casters > 0 ? h(SupplyItem,{check:true,name:"Heavy-duty locking casters",qty:supplyList.casters,detail:'3" swivel, 2 locking + 2 fixed'}) : null
            ),

            h("div",{style:{fontSize:11,fontWeight:700,color:"var(--gold)",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.05em"}},"Bins"),
            h("div",{style:{display:"flex",flexDirection:"column",gap:5}},
              binSummary.map(function(s, i) {
                return h(SupplyItem,{key:i,check:true,name:s,qty:"",detail:""});
              })
            ),

            h("div",{style:{marginTop:14,padding:10,background:"var(--input-bg)",borderRadius:8,fontSize:11,color:"var(--dim)",lineHeight:1.6}},
              "Also recommended: pocket hole jig (Kreg K4/K5 or 720), drill/driver, speed square, miter saw or circular saw."
            )
          ),

          // Blueprint
          h(Section,{title:"Blueprint"},
            h(Blueprint,{config:config,dims:dims})
          )
        )
      )
    )
  );
}

ReactDOM.render(h(App), document.getElementById("root"));
</script>
